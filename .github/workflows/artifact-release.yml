name: Publish reviewed HF artifacts
run-name: "${{ inputs.publish && 'Publish approved metadata' || 'Prepare metadata review' }} · ${{ inputs.target }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registered evaluation artifact
        type: choice
        required: true
        options:
          - grnti-text-classifier
          - chest-xray-classifier
          - brain-mri-segmentation
          - cardio-risk-rf
          - vehicle-keypoints
          - synthetic-vehicle-model
          - ue5-vehicle-synth
      publish:
        description: Publish the reviewed metadata/evidence payload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artifact-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'kiselyovd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements.txt
      - name: Verify source contracts and publication guards
        run: |
          node scripts/portfolio-artifacts.mjs
          python -m unittest discover -s automation/tests -v
      - name: Prepare the explicit candidate whitelist without authentication
        run: python automation/publish_artifact.py --target "$ARTIFACT_TARGET" --output release-candidate
      - name: Publish atomically and verify unchanged native artifacts plus exact readback
        if: inputs.publish
        env:
          HF_TOKEN: ${{ secrets.HF_PORTFOLIO_TOKEN }}
        run: python automation/publish_artifact.py --target "$ARTIFACT_TARGET" --output release-candidate --publish
      - name: Keep review payload and publication provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-artifact-${{ inputs.target }}
          path: release-candidate/
          retention-days: 14
