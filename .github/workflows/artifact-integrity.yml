name: Artifact integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  publisher-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements-dev.txt
      - name: Check publication source and offline guard regressions
        run: |
          python -m ruff check automation
          python -m ruff format --check --line-length 100 automation
          python -m unittest discover -s automation/tests -v

  cross-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate snapshots, reports, current HF cards and pinned native checksums
        run: node scripts/portfolio-artifacts.mjs --remote
